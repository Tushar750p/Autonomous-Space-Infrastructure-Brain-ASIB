name: APSE Rover prototype tests

on:
  push:
    branches: ["main", "feat/apse-rover-2d-prototype"]
    paths:
      - "research/apse-rover/**"
      - ".github/workflows/apse-rover-tests.yml"
  pull_request:
    paths:
      - "research/apse-rover/**"
      - ".github/workflows/apse-rover-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/apse-rover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run simulator
        env:
          MPLBACKEND: Agg
        run: python app.py
