[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asib"
version = "0.3.0"
description = "Autonomous Space Infrastructure Brain research testbed"
requires-python = ">=3.10"

[project.scripts]
asib = "asib.cli:main"
asib-benchmark = "run_benchmark:main"
asib-experiments = "run_experiments:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
