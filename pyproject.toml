[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asib"
version = "0.4.0"
description = "Autonomous Space Infrastructure Brain research testbed"
requires-python = ">=3.10"

[project.scripts]
asib = "asib.cli:main"
asib-benchmark = "asib.benchmark_cli:main"
asib-experiments = "asib.experiments_cli:main"
asib-selftest = "asib.selftest:run_selftest"

[tool.pytest.ini_options]
testpaths = ["tests"]
