services:
  asib:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASIB_HOST: "0.0.0.0"
      ASIB_PORT: "8080"
      ASIB_TICK_INTERVAL_S: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
