services:
  - type: web
    name: asib-mission-control
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ASIB_HOST
        value: 0.0.0.0
      - key: ASIB_PORT
        value: 10000
      - key: ASIB_STORE_PATH
        value: /data/asib.db
